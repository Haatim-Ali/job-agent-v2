projects:
  - name: Uplink -- Multi-Agent Food Rescue Negotiation
    context: "UCSC AI Hackathon 2026, Cisco \"When AI Agents Disagree\" track (team of 3)"
    dates: October 2026
    link: github.com/Haatim-Ali/uplink  # Haatim's fork of the team repo (saraxjain/uplink)
    bullets:
      - "Co-built a food-rescue system where 3 Claude agents with competing goals (speed, cost, need) negotiate every delivery, with donations logged by Claude photo counting or ElevenLabs voice"
      - "Re-architected the agents into 16 independent processes on Cisco's AGNTCY A2A protocol over NATS, with an agent directory, heartbeats, and 0 failed messages"
      - "Built the evaluation harness for 100 held-out scenarios, showing the agent team cut food lost by 67% vs. the best single agent and 93% vs. a nearest-shelter baseline"
      - "Improved Claude photo counting to within 10% on 33 of 34 test reads by re-reading only low-confidence photos, and added retries so no ElevenLabs voice line dropped"
    key_metrics:
      - "93% less food lost than a nearest-shelter baseline, 67% less than the best single agent (100 held-out scenarios)"
      - "16 agent processes over A2A/NATS with 0 failed messages"
      - "Photo counts within 10% on 33 of 34 test reads"
    narrative: "Team hackathon project; a teammate started the negotiation and Haatim built the distributed A2A runtime, the evaluation, the photo-accuracy work, and extensions to the agents. Say co-built, not designed."

